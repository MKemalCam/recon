id: http-missing-security-headers

info:
  name: HTTP Missing Security Headers
  author: socketz,geeknik,G4L1T0,convisoappsec,kurohost,dawid-czarnecki,forgedhallpass,jub0bs,userdehghani,celbahraoui,safejulian
  severity: info
  description: |
    This template searches for missing HTTP security headers. The impact of these missing headers can vary.
  classification:
    cwe-id: CWE-693
  metadata:
    max-request: 1
  tags: misconfig,headers,generic,vuln
  
 #info:
  #name: unilogies/bumsys < v2.0.2 - Clickjacking
  #author: ctflearner
  #severity: medium
  #description: |
   # This template checks for the presence of clickjacking prevention headers in the HTTP response, aiming to identify vulnerabilities related to the improper restriction of rendered UI layers or frames in the GitHub repository unilogies/bumsys prior to version 2.0.2.
  #impact: |
   # An attacker can trick users into performing unintended actions on the vulnerable application.
  #remediation: |
   # Upgrade to version 2.0.2 or later to mitigate the Clickjacking vulnerability.
  #reference:
    #- https://nvd.nist.gov/vuln/detail/CVE-2023-1362
    #- https://huntr.dev/bounties/e5959166-c8ef-4ada-9bb1-0ff5a9693bac/
    #- https://github.com/unilogies/bumsys/commit/8c5b27d54707f9805b27ef26ad741f2801e30e1f
    #- https://github.com/ctflearner/ctflearner
  #classification:
   # cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
    #cvss-score: 6.1
    #cve-id: CVE-2023-1362
    #cwe-id: CWE-1021
    #epss-score: 0.01411
    #epss-percentile: 0.70531
    #cpe: cpe:2.3:a:bumsys_project:bumsys:*:*:*:*:*:*:*:*
  #metadata:
    #verified: true
    #max-request: 1
    #vendor: bumsys_project
    #product: bumsys
  #tags: cve,cve2023,bumsys,clickjacking,huntr,bumsys_project,vuln

  
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3

    matchers-condition: or
    matchers:
      - type: dsl
        name: strict-transport-security
        dsl:
          - "!regex('(?i)strict-transport-security', header)"
          - "status_code != 301 && status_code != 302"
        condition: and

      - type: dsl
        name: content-security-policy
        dsl:
          - "!regex('(?i)content-security-policy', header)"
          - "status_code != 301 && status_code != 302"
        condition: and

      - type: dsl
        name: permissions-policy
        dsl:
          - "!regex('(?i)permissions-policy', header)"
          - "status_code != 301 && status_code != 302"
        condition: and

      - type: dsl
        name: x-frame-options
        dsl:
          - "!regex('(?i)x-frame-options', header)"
          - "status_code != 301 && status_code != 302"
        condition: and

      - type: dsl
        name: x-content-type-options
        dsl:
          - "!regex('(?i)x-content-type-options', header)"
          - "status_code != 301 && status_code != 302"
        condition: and

      - type: dsl
        name: x-permitted-cross-domain-policies
        dsl:
          - "!regex('(?i)x-permitted-cross-domain-policies', header)"
          - "status_code != 301 && status_code != 302"
        condition: and

      - type: dsl
        name: referrer-policy
        dsl:
          - "!regex('(?i)referrer-policy', header)"
          - "status_code != 301 && status_code != 302"
        condition: and

      - type: dsl
        name: cross-origin-embedder-policy
        dsl:
          - "!regex('(?i)cross-origin-embedder-policy', header)"
          - "status_code != 301 && status_code != 302"
        condition: and

      - type: dsl
        name: cross-origin-opener-policy
        dsl:
          - "!regex('(?i)cross-origin-opener-policy', header)"
          - "status_code != 301 && status_code != 302"
        condition: and

      - type: dsl
        name: cross-origin-resource-policy
        dsl:
          - "!regex('(?i)cross-origin-resource-policy', header)"
          - "status_code != 301 && status_code != 302"
        condition: and

      - type: dsl
        name: missing-content-type
        dsl:
          - "!regex('(?i)content-type:', header)"
          - "status_code == 200"
        condition: and

      - type: dsl
        name: content-type-charset-specification
        dsl:
          - "regex('(?i)content-type:\\s*text/html', header)"
          - "!regex('(?i)content-type:.*charset=', header)"
          - "status_code == 200"
        condition: and

        #cve-2023-1362-xframe.yaml
        - type: dsl
        dsl:
          - "status_code_1 == 200"
          - "!regex('X-Frame-Options', header)"
          - "contains(body, 'BUM</b>Sys</a>')"
        condition: and
        
